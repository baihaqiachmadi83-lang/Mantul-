  <style>
    body { background: var(--surface); }

    /* ── SESSION TABS ── */
    .sess-tabs {
      display: flex; gap: var(--space-2); overflow-x: auto;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      padding-bottom: var(--space-1); margin-bottom: var(--space-4);
    }
    .sess-tabs::-webkit-scrollbar { display: none; }
    .sess-tab {
      display: inline-flex; align-items: center; gap: 6px;
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-full);
      font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold);
      border: 1.5px solid var(--border); background: var(--card);
      color: var(--text-muted); white-space: nowrap; flex-shrink: 0;
      transition: all var(--transition-fast); cursor: pointer;
    }
    .sess-tab.active { background: #DC2626; border-color: #DC2626; color: white; }
    .sess-tab.done   { background: #FEF2F2; border-color: #EF4444; color: #B91C1C; }

    /* ── HERO CARD ── */
    .sess-hero {
      border-radius: var(--radius-2xl); padding: var(--space-5) var(--space-6);
      color: white; position: relative; overflow: hidden; margin-bottom: var(--space-4);
      background: linear-gradient(135deg, #DC2626, #7F1D1D);
    }
    .sess-hero-deco {
      position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
      font-size: 5rem; opacity: .15; pointer-events: none; line-height: 1;
    }

    /* ── PROGRESS STRIP ── */
    .phase-strip { display: flex; align-items: center; gap: 0; }
    .phase-node { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .phase-dot {
      width: 30px; height: 30px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 13px;
      font-weight: 700; transition: all var(--transition-base);
      border: 2px solid transparent; background: var(--surface-2); color: var(--text-faint);
    }
    .phase-dot.done { background: #EF4444; color: white; border-color: #EF4444; }
    .phase-dot.active { background: #DC2626; color: white; box-shadow: 0 0 0 4px #FCA5A5; }
    
    .phase-line { flex: 1; height: 2px; background: var(--border); margin: 0 -4px;
      position: relative; top: -10px; transition: background var(--transition-base); }
    .phase-line.done { background: #EF4444; }

    /* ── RESULT BARS ── */
    .skill-res-card {
      background: white; border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: var(--space-4); margin-bottom: var(--space-3);
      display: flex; align-items: center; gap: var(--space-4);
    }
    .skill-res-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; flex-shrink: 0;
    }
    .skill-res-body { flex: 1; }
    
    .sr-vocab { background: #DBEAFE; color: #1D4ED8; }
    .sr-speak { background: #FEF3C7; color: #B45309; }
    .sr-read  { background: var(--accent-100); color: var(--accent-700); }

      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px var(--space-2); border-radius: var(--radius-full);
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .07em; margin-bottom: var(--space-3);
      background: var(--danger-100); color: var(--danger);
    }

    .btn-tts-mini {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--danger-100); color: var(--danger); border: none;
      font-size: 1.2rem; cursor: pointer; transition: all .2s;
    }
    .btn-tts-mini.playing { animation: pulsePlay 1s infinite; background: #DC2626; color: white; }
    @keyframes pulsePlay {
      0% { box-shadow: 0 0 0 0 rgba(220,38,38,.4); }
      70% { box-shadow: 0 0 0 8px rgba(220,38,38,0); }
      100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
    }

      background: var(--surface-2); padding: var(--space-4); border-radius: var(--radius-md);
      margin-bottom: var(--space-4); font-size: var(--font-size-sm); color: var(--text-body);
      border-left: 4px solid var(--accent);
    }

          whyWrong: ['Not about water.', 'Not about sunlight.', null, 'Not about fire.']
        },
        {
          id: 'ft_r8', type: 'fill', readingText: '<b>Notice:</b><br>Please keep silent in the library.',
          text: 'In the library, visitors are asked to keep ____.',
          answer: 'silent', whyCorrect: '"Keep silent" means to stay quiet.'
        },
        {
          id: 'ft_r9', type: 'fill', readingText: '<b>Bus Schedule</b><br>First bus: 06.00<br>Last bus: 21.00',
          text: 'The last bus departs at ____.',
          answer: '21.00', whyCorrect: '"Last bus: 21.00" — that is 9 PM.'
        },
        {
          id: 'ft_r10', readingText: '<b>Product Label:</b><br>Best before: 10 March',
          text: '"Best before: 10 March" tells you the...',
          options: ['Date of production', 'Last date for best quality consumption', 'Date of purchase', 'Date of delivery'],
          correct: 1, whyCorrect: '"Best before" means it is at its best quality up to that date.',
          whyWrong: ['Usually "Manufactured on".', null, 'When you buy it.', 'When it was sent.']
        },
        {
          id: 'ft_r11', readingText: 'Ani works at a clinic. She checks patients\' blood pressure and gives them medicine.',
          text: 'Based on the text, what is Ani\'s job?',

        {

          text: 'Based on the sign, this stall sells...',
          options: ['Vegetables', 'Fresh fish', 'Bread', 'Clothes'],
          correct: 1, whyCorrect: 'The sign says "Fresh fish sold here" — so the stall sells fresh fish.',
          whyWrong: ['Vegetables are not mentioned in this sign.', null, 'Bread is not mentioned in this sign.', 'Clothes are not sold at a fish stall.']
        },
        {
          id: 'ft_r13', readingText: '<b>Cafe Menu</b><br>Coffee — 8,000<br>Bread — 6,000',
          text: 'If you buy one coffee and one bread, what is the total amount to pay?',
          options: ['8,000', '6,000', '14,000', '16,000'],
          correct: 2, whyCorrect: '8,000 + 6,000 = 14,000.',
          whyWrong: ['8,000 is only the price of the coffee.', '6,000 is only the price of the bread.', null, '16,000 is incorrect.']
        },
        {

          text: 'What time does Sri start working?',
          options: ['5 AM', '6 AM', '4 PM', '8 AM'],
          correct: 1, whyCorrect: 'The text says "She opens her stall at the market at 6 AM".',
          whyWrong: ['5 AM is not mentioned in the text.', null, '4 PM is when she goes home.', '8 AM is not mentioned in the text.']
        },
        {
          id: 'ft_r15', readingText: 'Joko is a farmer. He plants rice in the field. He works hard every day from sunrise to sunset.',
          text: 'Where does Joko work?',
          options: ['In an office', 'In the rice field', 'In the market', 'In a school'],
          correct: 1, whyCorrect: 'The text says "He plants rice in the field".',

      ]
    }
  ];

  /* ════════════════════════════════════════════════════════
     2. APP STATE & CONFIG
     ════════════════════════════════════════════════════════ */
  const App = {
    sess: 0, // 0=Vocab, 1=Speak, 2=Read, 3=Result
    qi: 0,
    xp: 0,
    scores: [0, 0, 0], // Store score per section
    wrongAnswers: [],   // Track wrong answers for review
    quizSess: null,

    init(){
      this._loadXP();
      FeedbackEngine.init({
        onNext:  () => this._nextQuestion(),
        onRetry: () => this._retryQuestion(),
        onSkip:  () => this._nextQuestion(),
      });
      if('speechSynthesis' in window) window.speechSynthesis.getVoices();
      this.render();
    },

    goTo(n) {
      if (n >= 0 && n <= 3) {
        FeedbackEngine.dismiss();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        this.sess = n;
        this.qi = 0;
        this.quizSess = null;
        this.render();
      }
    },

    render(){
      this._updateTabs();
      this._updateHeroBar();

      if(this.sess === 3) {
        this._renderResultPage();
        return;
      }

      if(!this.quizSess) {
        this.wrongAnswers = this.wrongAnswers || [];
        this.quizSess = QuizStore.startSession(`final_${TEST_DATA[this.sess].id}`);
      }

      const currentSection = TEST_DATA[this.sess];
      if(this.qi >= currentSection.questions.length){
        const res = QuizStore.finishSession(this.quizSess, currentSection.questions.length);
        this.scores[this.sess] = Math.round(res.score); // save percentage score
        this.quizSess = null;
        this.sess++;
        this.qi = 0;
        this.render();
        return;
      }

      this._renderQuestion();
    },

    _updateTabs(){
      const container = document.getElementById('sess-tabs-container');
      let html = '';
      TEST_DATA.forEach((s, i) => {
        const isDone = i < this.sess;
        const isAct = i === this.sess;
        
        let cls = 'sess-tab';
        if(isAct) cls += ' active';
        else if(isDone) cls += ' done';
        
        html += `<button class="${cls}" onclick="App.goTo(${i})">${s.emoji} ${s.title}</button>`;
      });
      if(this.sess === 3) {
        html += `<button class="sess-tab active">🏆 Result</button>`;
      }
      container.innerHTML = html;
    },

    _updateHeroBar(){
      let totalQ = 0, answered = 0;
      TEST_DATA.forEach((s, i) => {
        totalQ += s.questions.length;
        if(i < this.sess) answered += s.questions.length;
        else if(i === this.sess) answered += this.qi;
      });
      const pct = Math.round((answered / totalQ) * 100);
      const pb = document.getElementById('hero-bar');
      if(pb) pb.style.width = `${pct}%`;
    },

    _renderQuestion(){
      const s = TEST_DATA[this.sess];
      const q = s.questions[this.qi];
      const keys = ['A','B','C','D'];

      let readBoxHtml = '';
      if(q.readingText){
        readBoxHtml = `<div class="read-box">${q.readingText}</div>`;
      }
      
      let audioHtml = '';
      if(q.audioText){
        audioHtml = `
          <div style="text-align:center;margin-bottom:var(--space-3);">
            <button class="btn-tts-mini" id="btn-audio" onclick="App._playAudio('${q.audioText.replace(/'/g,"\\'")}')">🔊</button>
          </div>
        `;
      }

      let imgHtml = '';
      if(q.imageUrl){
        imgHtml = `
          <div style="text-align:center;margin-bottom:var(--space-4);">
            <img src="${q.imageUrl}" alt="Question Graphic" style="max-width:100%; border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); height:auto; max-height:200px; object-fit:cover;">
          </div>
        `;
      }

      let questionHtml = '';
      if (q.type === 'speaking') {
        questionHtml = `
          <div style="text-align:center;margin-bottom:var(--space-4);">
            <p style="font-size:var(--font-size-sm);color:var(--text-muted);margin-bottom:var(--space-2);">Read the question and answer out loud:</p>
            ${imgHtml}
            <p style="font-weight:800;font-size:var(--font-size-xl);color:var(--text-main);margin-bottom:var(--space-4);">${q.text}</p>
            
            <div id="mic-area">
              <button id="btn-mic" class="btn btn-outline" style="border-radius:var(--radius-full);width:80px;height:80px;font-size:2rem;display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-2);" onclick="App._toggleMic()">🎤</button>
              <p id="mic-hint" style="font-size:var(--font-size-xs);color:var(--text-faint);font-weight:700;">Tap to answer</p>
            </div>

            <div id="speaking-feedback" style="display:none;margin-top:var(--space-4);text-align:left;background:var(--surface-2);padding:var(--space-3);border-radius:var(--radius-md);">
               <p style="font-size:var(--font-size-xs);font-weight:800;color:var(--accent-700);margin-bottom:4px;">✅ Good job! Sample answer:</p>
               <p style="font-size:var(--font-size-sm);font-weight:700;color:var(--text-main);margin-bottom:var(--space-2);">${q.sampleAnswer}</p>
               ${audioHtml}
               <button class="btn btn-primary btn-block" style="margin-top:var(--space-3);" onclick="App._nextSpeaking()">Continue ➔</button>
            </div>
          </div>
          
          <div style="display:flex;justify-content:flex-end;margin-top:var(--space-4);">
            <button class="btn btn-outline" style="border-radius:var(--radius-full);font-size:var(--font-size-sm);" onclick="App._skipQuestion()">
              Skip / Next ➔
            </button>
          </div>
        `;
      } else if (q.type === 'fill') {
        questionHtml = `
          ${readBoxHtml}
          ${audioHtml}
          ${imgHtml}
          <p style="font-weight:700;font-size:var(--font-size-lg);margin-bottom:var(--space-4);text-align:center;line-height:1.4;">
            ${q.text}
          </p>
          <div style="display:flex;flex-direction:column;gap:var(--space-2); align-items:center;">
            <input type="text" id="fill-input" class="form-control" style="font-size:var(--font-size-lg); text-align:center; padding:var(--space-3); width:100%; max-width:300px; border:2px solid var(--border); border-radius:var(--radius-md);" placeholder="Type your answer here..." autocomplete="off">
            <button class="btn btn-primary" style="margin-top:var(--space-2); padding:var(--space-2) var(--space-4); border-radius:var(--radius-full);" onclick="App._handleFillAns()">Submit Answer</button>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:var(--space-4);">
            <button class="btn btn-outline" style="border-radius:var(--radius-full);font-size:var(--font-size-sm);" onclick="App._skipQuestion()">
              Skip / Next ➔
            </button>
          </div>
        `;
      } else {
        questionHtml = `
          ${readBoxHtml}
          ${audioHtml}
          ${imgHtml}
          <p style="font-weight:700;font-size:var(--font-size-lg);margin-bottom:var(--space-4);text-align:center;line-height:1.4;">
            ${q.text}
          </p>
          <div style="display:flex;flex-direction:column;gap:var(--space-2);" id="quiz-opts">
            ${q.options.map((opt, i) => `
              <button class="quiz-option" onclick="App._handleAns(${i})" aria-label="${opt}">
                <span class="quiz-option-key">${keys[i]}</span>
                <span class="quiz-option-text">${opt}</span>
              </button>
            `).join('')}
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:var(--space-4);">
            <button class="btn btn-outline" style="border-radius:var(--radius-full);font-size:var(--font-size-sm);" onclick="App._skipQuestion()">
              Skip / Next ➔
            </button>
          </div>
        `;
      }

      document.getElementById('activity-area').innerHTML = `
        <div style="display:flex;justify-content:space-between;margin-bottom:var(--space-3);align-items:center;">
          <span class="act-tag">${s.emoji} Section ${this.sess+1}: ${s.title}</span>
          <span style="font-size:var(--font-size-xs);color:var(--text-muted);font-weight:700;">Question ${this.qi+1} / ${s.questions.length}</span>
        </div>
        
        <div class="card" style="padding:var(--space-5);">
          ${questionHtml}
        </div>
      `;

      // Auto play audio if exists and not speaking
      if(q.audioText && q.type !== 'speaking') {
        setTimeout(() => this._playAudio(q.audioText), 500);
      }
    },

    _handleFillAns(){
      const s = TEST_DATA[this.sess];
      const q = s.questions[this.qi];
      const input = document.getElementById('fill-input');
      if(!input || !input.value.trim()) return;

      const userAns = input.value.trim().toLowerCase();
      const correctAns = q.answer.toLowerCase();
      const ok = userAns === correctAns;

      input.disabled = true;
      if(ok) {
        input.style.borderColor = 'var(--primary)';
        input.style.backgroundColor = 'var(--primary-50)';
      } else {
        input.style.borderColor = 'var(--danger)';
        input.style.backgroundColor = 'var(--danger-50)';
      }

      QuizStore.recordAnswer(this.quizSess, q.id, ok, 0, userAns);
      if(ok){
        this._addXP(25);
        FeedbackEngine.showCorrect(q, -1);
      } else {
        this.wrongAnswers.push({ q, sel: -1, userText: userAns, section: s.title });
        FeedbackEngine.showWrong(q, -1);
      }
    },

    _handleAns(sel){
      const s = TEST_DATA[this.sess];
      const q = s.questions[this.qi];
      const ok = sel === q.correct;

      document.querySelectorAll('.quiz-option').forEach((btn, i) => {
        btn.classList.add('quiz-option--disabled');
        if(i === q.correct) btn.classList.add('quiz-option--correct');
        else if(i === sel && !ok) btn.classList.add('quiz-option--wrong');
      });

      QuizStore.recordAnswer(this.quizSess, q.id, ok, 0, sel);
      if(ok){
        this._addXP(25);
        FeedbackEngine.showCorrect(q, sel);
      } else {
        // Track wrong answer for review
        this.wrongAnswers.push({ q, sel, section: s.title });
        FeedbackEngine.showWrong(q, sel);
      }
    },

    _nextQuestion(){
      this.qi++;
      this.render();
    },

    _skipQuestion(){
      FeedbackEngine.dismiss();
      const s = TEST_DATA[this.sess];
      const q = s.questions[this.qi];
      QuizStore.recordAnswer(this.quizSess, q.id, false, 0, -1);
      this._nextQuestion();
    },

    _retryQuestion(){
      document.querySelectorAll('.quiz-option').forEach(btn => {
        btn.classList.remove('quiz-option--disabled','quiz-option--wrong','quiz-option--correct');
      });
    },

    _playAudio(text){
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const btn = document.getElementById('btn-audio');
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      if(btn){
        utterance.onstart = () => btn.classList.add('playing');
        utterance.onend = () => btn.classList.remove('playing');
        utterance.onerror = () => btn.classList.remove('playing');
      }
      window.speechSynthesis.speak(utterance);
    },

    _toggleMic(){
      if(this._recognizing) {
        if(this._rec) this._rec.stop();
        return;
      }
      
      const btn = document.getElementById('btn-mic');
      const hint = document.getElementById('mic-hint');
      
      if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        if(hint) hint.textContent = "Browser not supported. Click Skip.";
        return;
      }
      
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      this._rec = new SpeechRec();
      this._rec.lang = 'en-US';
      this._rec.interimResults = false;
      this._rec.maxAlternatives = 1;

      this._rec.onstart = () => {
        this._recognizing = true;
        if(btn) {
          btn.classList.add('pulse');
          btn.style.borderColor = 'var(--danger)';
          btn.style.color = 'var(--danger)';
        }
        if(hint) hint.textContent = "Listening...";
      };

      this._rec.onend = () => {
        this._recognizing = false;
        if(btn) {
          btn.classList.remove('pulse');
          btn.style.borderColor = 'var(--border)';
          btn.style.color = 'var(--text-main)';
        }
        if(hint && hint.textContent === "Listening...") hint.textContent = "Tap to answer";
      };
      
      this._rec.onerror = (e) => {
        if(hint) hint.textContent = "Error: " + e.error;
      };

      this._rec.onresult = (e) => {
        const tr = e.results[0][0].transcript.trim();
        if(tr.length > 0) {
          // Passed
          document.getElementById('mic-area').style.display = 'none';
          document.getElementById('speaking-feedback').style.display = 'block';
          
          const s = TEST_DATA[this.sess];
          const q = s.questions[this.qi];
          QuizStore.recordAnswer(this.quizSess, q.id, true, 0, tr);
          this._addXP(25);
        }
      };
      
      this._rec.start();
    },
    
    _nextSpeaking(){
      this._nextQuestion();
    },

    /* ── RESULT PAGE ── */
    _renderResultPage(){
      // Calculate total average
      const avgScore = Math.round(this.scores.reduce((a,b)=>a+b, 0) / 3);
      try { localStorage.setItem('mantul_final_score', avgScore); } catch(e){}
      
      // Update global state
      try {
        const raw = localStorage.getItem('emodul_state');
        if(raw){
          const state = JSON.parse(raw);
          const u = (state.units||[]).find(u=>u.id===4);
          if(u){
            u.progress = Math.max(u.progress||0, avgScore);
            if(avgScore >= 60) u.status = 'done';
            localStorage.setItem('emodul_state', JSON.stringify(state));
          }
        }
      } catch{}

      // Recommendation logic
      let minScore = 100;
      let lowestIndex = -1;
      this.scores.forEach((sc, i) => {
        if(sc < minScore) { minScore = sc; lowestIndex = i; }
      });
      let recText = '';
      if(lowestIndex === 0) recText = 'Unit 1 (Vocabulary)';
      else if(lowestIndex === 1) recText = 'Unit 2 (Speaking)';
      else if(lowestIndex === 2) recText = 'Unit 3 (Reading)';

      let recHtml = '';
      if(minScore < 80 && lowestIndex !== -1) {
        recHtml = `
          <div style="background:var(--warm-50);border:1px solid var(--warm-200);border-left:3px solid var(--primary);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-top:var(--space-4);margin-bottom:var(--space-4);text-align:left;">
            <p style="font-size:10px;font-weight:800;text-transform:uppercase;color:var(--warm-700);margin-bottom:4px;">💡 Rekomendasi Belajar</p>
            <p style="font-size:var(--font-size-sm);color:var(--text-main);">Skor terendah Anda ada di bagian <strong>${TEST_DATA[lowestIndex].title}</strong>. Sebaiknya ulangi <strong>${recText}</strong> untuk memperkuat pemahaman Anda.</p>
          </div>
        `;
      }

      let html = `
        <div class="card" style="padding:var(--space-6);text-align:center;border:2px solid var(--accent);margin-bottom:var(--space-5);">
          <div style="font-size:3.5rem;animation:badgeBounce .6s ease both;margin-bottom:var(--space-3);" aria-hidden="true">🎓</div>
          <h2 style="font-size:var(--font-size-2xl);font-weight:800;color:var(--accent-700);margin-bottom:var(--space-2);">
            Test Complete!
          </h2>
          <p style="color:var(--text-body);margin-bottom:var(--space-3);line-height:1.5;">
            Congratulations! You have completed the whole evaluation. Here is a summary of your skills:
          </p>
          <div style="font-size:var(--font-size-2xl);font-weight:900;color:var(--primary);margin-bottom:var(--space-4);">
            Final Score: ${avgScore}%
          </div>
          ${recHtml}
        </div>
        
        <h3 style="font-size:var(--font-size-sm);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:var(--space-3);">
          Skills Summary
        </h3>
      `;

      TEST_DATA.forEach((s, i) => {
        const sc = this.scores[i];
        let msg = sc >= 80 ? '⭐ Excellent' : sc >= 60 ? '👍 Good' : '🔄 Needs Practice';
        
        html += `
          <div class="skill-res-card">
            <div class="skill-res-icon ${s.themeClass}">${s.emoji}</div>
            <div class="skill-res-body">
              <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                <span style="font-weight:700;">${s.title}</span>
                <span style="font-weight:800;color:var(--text-main);">${sc}%</span>
              </div>
              <div class="progress-bar-track progress-bar-track--thin" style="margin-bottom:6px;">
                <div class="progress-bar-fill" style="width:${sc}%; background:var(--primary);"></div>
              </div>
              <p style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">${msg}</p>
            </div>
          </div>
        `;
      });

      // Wrong answer review section
      const wa = this.wrongAnswers || [];
      if(wa.length > 0){
        html += `
          <h3 style="font-size:var(--font-size-sm);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-top:var(--space-5);margin-bottom:var(--space-3);">📝 Review My Mistakes (${wa.length})</h3>
        `;
        wa.forEach((item, idx) => {
          const keys = ['A','B','C','D'];
          html += `
            <div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--danger);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-2);">
              <p style="font-size:10px;font-weight:800;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px;">${item.section} · Q${idx+1}</p>
              <p style="font-size:var(--font-size-sm);font-weight:700;color:var(--text-main);margin-bottom:var(--space-2);">${item.q.text}</p>
              <div style="display:flex;flex-direction:column;gap:4px;">
                <div style="display:flex;align-items:center;gap:var(--space-2);">
                  <span style="background:var(--danger-100);color:var(--danger);font-size:10px;font-weight:800;padding:2px 8px;border-radius:var(--radius-full);">YOUR ANSWER</span>
                  <span style="font-size:var(--font-size-sm);color:#B91C1C;">${item.q.type==='fill' ? item.userText : keys[item.sel]+': '+item.q.options[item.sel]}</span>
                </div>
                <div style="display:flex;align-items:center;gap:var(--space-2);">
                  <span style="background:var(--accent-100);color:var(--accent-700);font-size:10px;font-weight:800;padding:2px 8px;border-radius:var(--radius-full);">CORRECT</span>
                  <span style="font-size:var(--font-size-sm);color:#065F46;">${item.q.type==='fill' ? item.q.answer : keys[item.q.correct]+': '+item.q.options[item.q.correct]}</span>
                </div>
                <p style="font-size:var(--font-size-xs);color:var(--text-body);margin-top:4px;border-top:1px solid var(--border);padding-top:4px;">💡 ${item.q.whyCorrect}</p>
              </div>
            </div>
          `;
        });
      }

      html += `
        <div style="margin-top:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);">
          ${avgScore >= 60 ? '<a href="certificate-preview.html" class="btn btn-accent btn-block">🎓 Get Certificate</a>' : ''}
          <a href="index.html" class="btn btn-primary btn-block">Back to Home 🏠</a>
          <button class="btn btn-outline btn-block" onclick="App.wrongAnswers=[]; location.reload()">Retry Final Test ↺</button>
        </div>
      `;

      document.getElementById('activity-area').innerHTML = html;
      
      if(avgScore >= 60 && typeof Utils !== 'undefined') Utils.showConfetti?.();
    },

    _addXP(n){
      this.xp += n;
      try{ localStorage.setItem('emodul_final_xp', this.xp); }catch{}
      const el = document.getElementById('nav-xp');
      if(el){
        el.textContent = `${this.xp} XP`;
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = 'heartbeat .4s ease both';
      }
    },
    _loadXP(){
      try{ this.xp = parseInt(localStorage.getItem('emodul_final_xp')||'0',10)||0; }catch{}
    }
  };

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', ()=>App.init());
  } else {
    App.init();
  }
  </script>
</body>
</html>
