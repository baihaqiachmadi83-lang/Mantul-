<script>/*MANTUL_THEME_BOOT*/
(function(){try{var t=localStorage.getItem('mantul_theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
window.toggleTheme=function(){try{var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',cur);localStorage.setItem('mantul_theme',cur);var ic=document.getElementById('theme-icon');if(ic)ic.textContent=cur==='dark'?'☀️':'🌙';var fic=document.getElementById('mantul-float-icon');if(fic)fic.textContent=cur==='dark'?'☀️':'🌙';}catch(e){}};
document.addEventListener('DOMContentLoaded',function(){try{var cur=document.documentElement.getAttribute('data-theme');var ic=document.getElementById('theme-icon');if(ic){ic.textContent=cur==='dark'?'☀️':'🌙';return;}var b=document.createElement('button');b.type='button';b.title='Toggle Light/Dark Mode';b.setAttribute('aria-label','Toggle light and dark mode');b.onclick=window.toggleTheme;b.style.cssText='position:fixed;top:14px;right:14px;z-index:99999;width:40px;height:40px;border-radius:9999px;border:none;background:rgba(120,120,120,.18);color:inherit;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);';var s=document.createElement('span');s.id='mantul-float-icon';s.textContent=cur==='dark'?'☀️':'🌙';b.appendChild(s);document.body.appendChild(b);}catch(e){}});
</script>

  <style>
    /* ══════════════════════════════════════════════════════
       READING PAGE – Page-specific styles
       ══════════════════════════════════════════════════════ */
    body { background: var(--surface); }

    /* ── SESSION TABS ── */
    .sess-tabs {
      display: flex; gap: var(--space-2); overflow-x: auto;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      padding-bottom: var(--space-1);
    }
    .sess-tabs::-webkit-scrollbar { display: none; }
    .sess-tab {
      display: inline-flex; align-items: center; gap: 6px;
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-full);
      font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold);
      border: 1.5px solid var(--border); background: var(--card);
      color: var(--text-muted); cursor: pointer; white-space: nowrap;
      flex-shrink: 0; transition: all var(--transition-fast);
      -webkit-tap-highlight-color: transparent;
    }
    .sess-tab.active  { background: var(--primary); border-color: var(--primary); color: white; }
    .sess-tab.done    { background: var(--accent-50); border-color: var(--accent); color: var(--accent-700); }
    .sess-tab.locked  { opacity: .4; cursor: not-allowed; pointer-events: none; }

    /* ── PHASE STRIP ── */
    .phase-strip { display: flex; align-items: center; gap: 0; }
    .phase-node { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .phase-dot {
      width: 30px; height: 30px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 13px;
      font-weight: 700; transition: all var(--transition-base);
      border: 2px solid transparent;
    }
    .phase-dot.done    { background: var(--accent); color: white; }
    .phase-dot.active  { background: var(--primary); color: white; box-shadow: 0 0 0 4px var(--primary-100); }
    .phase-dot.upcoming{ background: var(--surface-2); color: var(--text-faint); border-color: var(--border-2); }
    .phase-label { font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-faint); text-align: center; }
    .phase-label.active-label { color: var(--primary); }
    .phase-line { flex: 1; height: 2px; background: var(--border); margin: 0 -4px;
      position: relative; top: -10px; transition: background var(--transition-base); }
    .phase-line.done { background: var(--accent); }

    /* ── HERO CARD ── */
    .sess-hero {
      border-radius: var(--radius-2xl); padding: var(--space-5) var(--space-6);
      color: white; position: relative; overflow: hidden; margin-bottom: var(--space-4);
    }
    .sess-hero-deco {
      position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
      font-size: 5rem; opacity: .15; pointer-events: none; line-height: 1;
    }

    /* ── READING TEXT AREA ── */
    .reading-box {
      background: white; border-radius: var(--radius-xl);
      padding: var(--space-6); box-shadow: var(--shadow-sm);
      border: 1px solid var(--border); position: relative;
      font-family: var(--font-family);
    }
    .reading-box.style-sign {
      background: var(--danger-50); border: 3px solid var(--danger-600); text-align: center;
      color: var(--danger-900); font-weight: 800; font-size: 2rem;
    }
    .reading-box.style-notice {
      background: var(--primary-50); border: 1px solid var(--primary-400); color: var(--primary-800);
    }
    .reading-box.style-menu {
      background: var(--warm-50); border: 1px dashed var(--warm-600); color: var(--warm-700);
    }
    .reading-box.style-label {
      background: var(--accent-50); border-left: 6px solid var(--accent-600); color: var(--accent-700);
    }
    .reading-box.style-story {
      line-height: 1.8; font-size: 1.1rem; color: var(--text-main);
    }

    /* TTS Button & Highlight */
    .btn-tts-large {
      display: inline-flex; align-items: center; gap: 8px;
      padding: var(--space-2) var(--space-4); border-radius: var(--radius-full);
      background: var(--primary-50); color: var(--primary-700);
      border: 1px solid var(--primary-200); font-weight: 700;
      font-size: var(--font-size-sm); cursor: pointer; transition: all .2s;
      margin-bottom: var(--space-4);
    }
    .btn-tts-large:hover { background: var(--primary-100); transform: translateY(-1px); }
    .btn-tts-large.playing {
      background: var(--primary); color: white; border-color: var(--primary);
      animation: pulsePlay 1.5s infinite;
    }
    @keyframes pulsePlay {
      0% { box-shadow: 0 0 0 0 rgba(37,99,235,.4); }
      70% { box-shadow: 0 0 0 8px rgba(37,99,235,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); }
    }

    .word-highlight {
      background: #FEF08A; /* yellow-200 */
      border-radius: 4px; padding: 0 2px;
      transition: background .1s;
    }

    /* ── GLOSSARY ── */
    .gl-word {
      border-bottom: 2px dotted var(--accent); cursor: pointer;
      color: var(--accent-700); font-weight: 600; padding: 0 2px;
      transition: background .2s;
    }
    .gl-word:hover { background: var(--accent-50); }
    
    /* Toast for glossary meaning */
    .gl-toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--text-main); color: var(--surface);
      padding: var(--space-3) var(--space-5); border-radius: var(--radius-lg);
      font-weight: 700; box-shadow: var(--shadow-lg); opacity: 0;
      transition: all .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .gl-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .gl-toast-en { font-size: 1.1rem; color: var(--accent); }
    .gl-toast-id { font-size: var(--font-size-base); }

    /* ── ACTIVITY TAG ── */
    .act-tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px var(--space-2); border-radius: var(--radius-full);
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .07em; margin-bottom: var(--space-3);
    }
    .act-read  { background: var(--primary-100); color: var(--primary-700); }
    .act-quiz  { background: var(--warm-100);    color: var(--warm-700); }

    /* ── SCORE RING ── */
    .score-ring {
      width: 110px; height: 110px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-4); position: relative;
    }
    .score-ring-inner {
      width: 80px; height: 80px; border-radius: 50%; background: var(--card);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    /* SIGN BOARD (added) */
    .sign-board{ background:#fff; color:#111; border:4px solid #DC2626; border-radius:var(--radius-xl); padding:var(--space-6); text-align:center; box-shadow:var(--shadow-md); }
    .sign-ico{ font-size:3.5rem; line-height:1; margin-bottom:var(--space-2); }
    .sign-text{ font-size:1.8rem; font-weight:900; letter-spacing:.02em; }
    .sign-explain{ padding:var(--space-4); margin-top:var(--space-3); }
    .sign-explain-title{ font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin-bottom:var(--space-2); }
    .sign-explain-meaning{ font-size:var(--font-size-lg);font-weight:700;color:var(--text-main);margin-bottom:var(--space-2); }
    .sign-explain-where{ font-size:var(--font-size-sm);color:var(--text-muted); }
    .act-game{ background:#EDE9FE; color:#6D28D9; }
    .match-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3); }
    .match-col{ display:flex; flex-direction:column; gap:var(--space-2); }
    .match-item{ display:flex;align-items:center;gap:8px;justify-content:center;text-align:center; padding:var(--space-3); border-radius:var(--radius-lg); border:2px solid var(--border); background:var(--card); color:var(--text-main); font-weight:700; font-size:var(--font-size-sm); cursor:pointer; transition:all .15s; min-height:60px; -webkit-tap-highlight-color:transparent; }
    .match-item.selected{ border-color:var(--primary); background:var(--primary-50); }
    .match-item.matched{ border-color:var(--accent); background:var(--accent-50); color:var(--accent-700); cursor:default; opacity:.85; }
    .match-item.wrong{ border-color:var(--danger); background:#FEF2F2; }
    .match-ico{ font-size:1.2rem; }
    @keyframes mgshake{ 0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);} }
    .match-item.shake{ animation:mgshake .4s; }
  </style>
</head>

  <script>
  'use strict';

  /* ============================================================
     UNIT 3 - READING PUBLIC SIGNS (each sign separated + meaning)
     Flow per set: Signs (Material) -> Quiz -> Matching Game
     ============================================================ */
  const UNITS = [
    /* ─── SECTION 0: Prohibition Signs ─── */
    {
      title:'Prohibition Signs', emoji:'\u{1F6AB}', color:'#DC2626',
      bg:'linear-gradient(135deg,#DC2626,#991B1B)',
      desc:'Signs that tell you what you must NOT do.',
      tips:[
        { icon:'💡', title:'How to read prohibition signs', body:'Prohibition signs usually start with <b>NO</b> or <b>DO NOT</b>. They have a red circle with a line through it. They mean you are <b>not allowed</b> to do something.' },
        { icon:'📌', title:'Key vocabulary', body:'<b>No / Do Not</b> = Dilarang / Jangan · <b>Keep off</b> = Jauhi / Jangan injak · <b>Entry</b> = Masuk · <b>Littering</b> = Membuang sampah sembarangan' },
        { icon:'⚠️', title:'Penalty notice', body:'Some signs also add a warning like <b>"Fine: Rp 500,000"</b>. This tells you there is a penalty (denda) if you break the rule.' }
      ],
      signs:[
        { text:'NO SMOKING', icon:'\u{1F6AD}', meaning:'You must not smoke in this area.', id_:'Anda dilarang merokok di area ini.', where:'Hospitals, petrol stations, restaurants.', short:'Do not smoke here' },
        { text:'NO PARKING', icon:'\u26D4', meaning:'You must not park your vehicle here.', id_:'Anda dilarang memarkir kendaraan di sini.', where:'In front of gates, hospital entrances, and fire lanes.', short:'Do not park here' },
        { text:'NO LITTERING', icon:'\u{1F5D1}\uFE0F', meaning:'Do not throw rubbish here. Always use the bin.', id_:'Jangan membuang sampah sembarangan. Gunakan tempat sampah.', where:'Parks, streets, markets, and public places.', short:'Do not throw rubbish' },
        { text:'KEEP OFF THE GRASS', icon:'\u{1F331}', meaning:'Do not walk or step on the grass.', id_:'Jangan berjalan atau menginjak rumput.', where:'Parks, gardens, and school grounds.', short:'Stay off the grass' },
        { text:'NO ENTRY', icon:'\u26D4', meaning:'You are not allowed to enter this area.', id_:'Anda tidak diizinkan masuk ke area ini.', where:'Restricted rooms, staff-only areas, one-way streets.', short:'Do not enter here' },
        { text:'DO NOT DISTURB', icon:'\u{1F6AA}', meaning:'Please do not knock or make noise. Someone is busy or resting.', id_:'Tolong jangan mengetuk atau berisik. Seseorang sedang sibuk atau istirahat.', where:'Hotel rooms, offices, hospitals.', short:'Do not make noise here' }
      ],
      quiz:[
        { id:'r0_1', text:"You see a 'NO SMOKING' sign. What should you do?",
          options:['Smoke quietly','Do not smoke here','Smoke near the door','Ask for permission'],
          correct:1, whyCorrect:'"No smoking" means you must not smoke in this area at all.',
          whyWrong:['You still may not smoke, even quietly.', null, 'The sign covers the entire area, not just certain spots.', 'Smoking is simply not allowed — no permission needed.'],
          example:'No smoking is allowed in this restaurant.' },
        { id:'r0_2', text:"What does 'KEEP OFF THE GRASS' mean?",
          options:['Sit on the grass','Do not step on the grass','Cut the grass','Water the grass'],
          correct:1, whyCorrect:'"Keep off" means do not step on or walk on something.',
          whyWrong:['You should not sit on it either.', null, 'It is not an instruction to cut the grass.', 'It is not about watering the grass.'],
          example:'Keep off the grass — please use the path.' },
        { id:'r0_3', text:"Which word on a sign means 'Dilarang'?",
          options:['Caution','Please','No / Do Not','Exit'],
          correct:2, whyCorrect:'"No" and "Do Not" are the English words that mean dilarang. They prohibit an action.',
          whyWrong:['"Caution" means hati-hati — a warning, not a prohibition.', '"Please" is a polite request, not a prohibition.', null, '"Exit" means the way out.'],
          example:'No entry. Do not enter this area.' },
        { id:'r0_4', text:"Where would you most likely see a 'NO PARKING' sign?",
          options:['Inside a restaurant','In front of a hospital entrance','In a park','On the roof'],
          correct:1, whyCorrect:'"No parking" signs are common in front of hospital entrances, fire lanes, and gates to keep them clear.',
          whyWrong:['Restaurants usually park in a separate lot — not the sign location.', null, 'Parks usually allow parking in designated areas.', 'Signs are placed where vehicles park, not on rooftops.'],
          example:'No parking in front of the hospital entrance.' },
        { id:'r0_5', text:"A sign says 'NO ENTRY'. What does this mean?",
          options:['You may enter freely','Only staff can exit','You are not allowed to go in','Come in and sit'],
          correct:2, whyCorrect:'"No entry" means you are not permitted to enter that area.',
          whyWrong:['It means the opposite — you cannot enter freely.', '"No entry" is about entering, not exiting.', null, 'It is a prohibition sign, not an invitation.'],
          example:'No entry — this area is for staff only.' }
      ]
    },

    /* ─── SECTION 1: Warning Signs ─── */
    {
      title:'Warning Signs', emoji:'\u26A0\uFE0F', color:'#D97706',
      bg:'linear-gradient(135deg,#D97706,#92400E)',
      desc:'Signs that warn you to be careful and stay safe.',
      tips:[
        { icon:'💡', title:'How to read warning signs', body:'Warning signs usually have a <b>yellow or orange triangle</b>. Words like <b>CAUTION</b>, <b>WARNING</b>, <b>DANGER</b>, or <b>BEWARE</b> tell you something could be hazardous.' },
        { icon:'📌', title:'Key vocabulary', body:'<b>Caution / Beware</b> = Hati-hati / Waspada · <b>Slippery</b> = Licin · <b>Voltage</b> = Tegangan listrik · <b>Fragile</b> = Mudah pecah' },
        { icon:'🛡️', title:'What to do', body:'When you see a warning sign: <b>slow down</b>, <b>be careful</b>, and <b>follow any instructions</b>. Warning signs are placed to protect you from getting hurt.' }
      ],
      signs:[
        { text:'CAUTION: WET FLOOR', icon:'\u26A0\uFE0F', meaning:'Be careful. The floor is wet and may be slippery.', id_:'Hati-hati. Lantai basah dan mungkin licin.', where:'Malls, toilets, and corridors after cleaning.', short:'The floor is wet and slippery' },
        { text:'HIGH VOLTAGE', icon:'\u26A1', meaning:'Danger! Strong electricity here. Do not touch anything.', id_:'Bahaya! Listrik tegangan tinggi. Jangan sentuh apa pun.', where:'Electrical boxes, power stations, generators.', short:'Danger: strong electricity' },
        { text:'MIND THE STEP', icon:'\u{1F6B6}', meaning:'Watch your step. The floor level changes here.', id_:'Perhatikan langkah Anda. Ada perbedaan tinggi lantai di sini.', where:'Doorways, stairs, and train platforms.', short:'Watch your step' },
        { text:'SLIPPERY WHEN WET', icon:'\u{1F4A7}', meaning:'This surface becomes very slippery when it rains or gets wet.', id_:'Permukaan ini menjadi sangat licin saat hujan atau basah.', where:'Parking lots, ramps, and bathrooms.', short:'Floor is slippery when wet' },
        { text:'BEWARE OF DOG', icon:'\u{1F415}', meaning:'There is a dog here that may bite. Be careful.', id_:'Ada anjing yang mungkin menggigit. Berhati-hatilah.', where:'Houses, factories, and private property.', short:'Dog may bite, be careful' },
        { text:'FRAGILE: HANDLE WITH CARE', icon:'\u{1F4E6}', meaning:'This item breaks easily. Carry it gently.', id_:'Barang ini mudah pecah. Bawa dengan hati-hati.', where:'Delivery packages and storage rooms.', short:'Handle gently, easily broken' }

  const App = {
    sess:0, phase:0, si:0, xp:0, done:[false,false,false,false],
    cs:{ qi:0, qs:[], quizSess:null },
    cq:{ qi:0, score:0, qs:[], quizSess:null },
    mg:{ sel:null, matched:0, total:0 },
    PHASE_ICONS:['\u{1F4D6}','\u270D\uFE0F','\u{1F3AE}'],
    PHASE_NAMES:['Material','Exercise','Game'],

    init(){
      this._loadProgress(); this._loadXP();
      FeedbackEngine.init({ 
        onNext:()=>this.sess===4?this._closingQuizNext():this._quizNext(), 
        onRetry:()=>this.sess===4?this._closingQuizRetry():this._quizRetry(), 
        onSkip:()=>this.sess===4?this._closingQuizNext():this._quizNext() 
      });
      if('speechSynthesis' in window) window.speechSynthesis.getVoices();
      this.render();
    },
    goTo(n){ FeedbackEngine.dismiss(); if('speechSynthesis' in window) window.speechSynthesis.cancel();
      this.sess=n; this.phase=0; this.si=0; this.render(); window.scrollTo({top:0,behavior:'smooth'}); },
    nextPhase(){ if(this.phase<2){ this.phase++; this.render(); } else { this._completeSess(); } },

    render(){ this._updateHero(); this._updateTabs(); this._updatePhaseStrip();
      if(this.sess===4){ this._renderClosingQuiz(); return; }
      if(this.phase===0) this._renderSigns();
      else if(this.phase===1) this._renderQuiz();
      else this._renderGameHub();
    },

    _updateHero(){ 
      if(this.sess===4){
        document.getElementById('sess-hero').style.background='linear-gradient(135deg,#DC2626,#7F1D1D)';
        document.getElementById('hero-deco').textContent='🎯';
        document.getElementById('hero-title').textContent='Quiz';
        document.getElementById('hero-desc').textContent='Test your knowledge from all reading units.';
        const bar=document.getElementById('hero-bar');
        if(bar) bar.style.width='0%';
        return;
      }
      const s=UNITS[this.sess];
      document.getElementById('sess-hero').style.background=s.bg;
      document.getElementById('hero-deco').textContent=s.emoji;
      document.getElementById('hero-title').textContent=s.title;
      document.getElementById('hero-desc').textContent=s.desc;
      const pct=Math.round((this.phase/2)*100);
      const bar=document.getElementById('hero-bar');
      if(bar){ bar.style.width='0%'; setTimeout(()=>{ bar.style.width=pct+'%'; },100); }
    },
    _updateTabs(){ for(let i=0;i<5;i++){ const el=document.getElementById('tab-'+i); if(!el) continue;
      el.className='sess-tab'; if(i===this.sess) el.classList.add('active'); else if(i<4 && this.done[i]) el.classList.add('done'); el.setAttribute('aria-selected', i===this.sess?'true':'false'); } },
    _updatePhaseStrip(){ const strip=document.getElementById('phase-strip'); const lbl=document.getElementById('phase-label-text'); const pp=document.getElementById('phase-panel'); if(this.sess===4){ if(pp) pp.style.display='none'; return; } if(pp) pp.style.display=''; if(!strip) return;
      let html=''; this.PHASE_NAMES.forEach((name,i)=>{ const isDone=i<this.phase; const isAct=i===this.phase;
        const cls=isDone?'done':isAct?'active':'upcoming'; const icon=isDone?'\u2713':this.PHASE_ICONS[i];
        const lblCls=isAct?'phase-label active-label':'phase-label';
        html+='<div class="phase-node"><div class="phase-dot '+cls+'" title="'+name+'">'+icon+'</div><span class="'+lblCls+'">'+name+'</span></div>';
        if(i<2) html+='<div class="phase-line '+(isDone?'done':'')+'"></div>';
      }); strip.innerHTML=html; },

    /* PHASE 0: SIGNS - one sign per screen + tips on first sign */
    _renderSigns(){ const s=UNITS[this.sess]; const total=s.signs.length; const sign=s.signs[this.si];
      const isLast=this.si>=total-1;

      document.getElementById('activity-area').innerHTML=
        '<span class="act-tag act-read">🪧 Sign '+(this.si+1)+' of '+total+'</span>'+
        '<div class="progress-bar-track progress-bar-track--thin" style="margin-bottom:var(--space-4);"><div class="progress-bar-fill" style="width:'+Math.round(((this.si+1)/total)*100)+'%;transition:width .4s ease;"></div></div>'+
        '<div class="sign-board" style="border-color:'+s.color+';color:'+s.color+';"><div class="sign-ico">'+sign.icon+'</div><div class="sign-text">'+sign.text+'</div></div>'+
        '<div style="text-align:center;margin:var(--space-3) 0;"><button class="btn-tts-large" onclick="App.speak(&quot;'+sign.text+'&quot;,this)">🔊 Read the sign</button></div>'+
        '<div class="card sign-explain"><p class="sign-explain-title">💡 What it means</p><p class="sign-explain-meaning">'+sign.meaning+'</p><p style="font-size:var(--font-size-sm);color:var(--text-muted);font-style:italic;margin-bottom:var(--space-3);">'+(sign.id_||'')+'</p><p class="sign-explain-where"><strong>Where you see it:</strong> '+sign.where+'</p></div>'+
        '<div style="display:flex;gap:var(--space-2);margin-top:var(--space-4);">'+
          (this.si>0?'<button class="btn" style="flex:1;background:var(--surface-2);color:var(--text-main);" onclick="App.prevSign()">← Previous</button>':'')+
          (isLast?'<button class="btn btn-primary" style="flex:2;" onclick="App._finishSigns()">I understand → Exercise</button>':'<button class="btn btn-primary" style="flex:2;" onclick="App.nextSign()">Next sign →</button>')+
        '</div>';
    },
    nextSign(){ const s=UNITS[this.sess]; if(this.si<s.signs.length-1){ this.si++; this._addXP(3); this._renderSigns(); window.scrollTo({top:0,behavior:'smooth'}); } },
    prevSign(){ if(this.si>0){ this.si--; this._renderSigns(); } },
    _finishSigns(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); this._addXP(10); this.nextPhase(); },

    speak(text,btn){ if(!('speechSynthesis' in window)) return; window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.95;
      const voices=window.speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
      if(voices.length) u.voice=voices[0];
      window._synth_u=u;
      if(btn){ u.onstart=()=>btn.classList.add('playing'); u.onend=()=>btn.classList.remove('playing'); u.onerror=()=>btn.classList.remove('playing'); }
      window.speechSynthesis.speak(u);
    },

    /* PHASE 1: QUIZ */
    _renderQuiz(){ const s=UNITS[this.sess];
      this.cs={ qi:0, qs:s.quiz, quizSess:QuizStore.startSession('read_unit3_s'+this.sess) };
      this._renderQuizQ();
    },
    _renderQuizQ(){ const cs=this.cs; if(cs.qi>=cs.qs.length){ this._renderQuizResult(); return; }
      const q=cs.qs[cs.qi]; const keys=['A','B','C','D']; const pct=Math.round((cs.qi/cs.qs.length)*100);
      document.getElementById('activity-area').innerHTML=
        '<span class="act-tag act-quiz">\u270D\uFE0F Comprehension Quiz \u00B7 Question '+(cs.qi+1)+' / '+cs.qs.length+'</span>'+
        '<div class="progress-bar-track progress-bar-track--thin" style="margin-bottom:var(--space-4);"><div class="progress-bar-fill" style="width:'+pct+'%;transition:width .4s ease;"></div></div>'+
        '<div class="card" style="padding:var(--space-5);"><p style="font-size:var(--font-size-lg);font-weight:700;color:var(--text-main);margin-bottom:var(--space-4);text-align:center;">'+q.text+'</p>'+
        '<div style="display:flex;flex-direction:column;gap:var(--space-2);" id="quiz-opts">'+
        q.options.map((opt,i)=>'<button class="quiz-option" onclick="App._handleQuizAns('+i+')" aria-label="Option '+keys[i]+': '+opt+'"><span class="quiz-option-key">'+keys[i]+'</span><span class="quiz-option-text">'+opt+'</span></button>').join('')+
        '</div></div>';
    },
    _handleQuizAns(sel){ const cs=this.cs; const q=cs.qs[cs.qi]; const ok=sel===q.correct;
      document.querySelectorAll('#quiz-opts .quiz-option').forEach((btn,i)=>{ btn.classList.add('quiz-option--disabled');
        if(i===q.correct) btn.classList.add('quiz-option--correct'); else if(i===sel && !ok) btn.classList.add('quiz-option--wrong'); });
      QuizStore.recordAnswer(cs.quizSess,q.id,ok,0,sel);
      if(ok){ this._addXP(20); FeedbackEngine.showCorrect(q,sel); } else { FeedbackEngine.showWrong(q,sel); }
    },
    _quizNext(){ this.cs.qi++; this._renderQuizQ(); },
    _quizRetry(){ document.querySelectorAll('#quiz-opts .quiz-option').forEach((btn,i)=>{ btn.classList.remove('quiz-option--disabled','quiz-option--wrong','quiz-option--correct'); btn.onclick=()=>this._handleQuizAns(i); }); },
    _renderQuizResult(){ const cs=this.cs; const res=QuizStore.finishSession(cs.quizSess,cs.qs.length); const pct=res.score; this._addXP(20);
      document.getElementById('activity-area').innerHTML=
        '<div class="card" style="padding:var(--space-6);text-align:center;">'+
        '<div class="score-ring" style="background:conic-gradient(var(--accent) '+(pct*3.6)+'deg, var(--surface-2) '+(pct*3.6)+'deg);"><div class="score-ring-inner"><span style="font-size:1.65rem;font-weight:800;color:var(--accent-700);">'+pct+'%</span></div></div>'+
        '<h2 style="font-size:var(--font-size-xl);font-weight:800;margin-bottom:var(--space-2);">Quiz complete! \u{1F389}</h2>'+
        '<p style="color:var(--text-muted);margin-bottom:var(--space-4);">Now play a game to review the signs.</p>'+
        '<button class="btn btn-accent btn-block" onclick="App.nextPhase()">Play a Game \u{1F3AE}</button></div>';
    },

    /* PHASE 2: MATCHING GAME */
    _renderGame(){ const s=UNITS[this.sess];
      const pool = this._shufArr([...s.signs]).slice(0, 5);
      const pairs=pool.map((x,idx)=>({idx:idx, sign:x.text, icon:x.icon, short:x.short}));
      const rights=pairs.map(p=>({idx:p.idx, short:p.short})).sort(()=>Math.random()-0.5);
      this.mg={ sel:null, matched:0, total:pairs.length };
      const leftHtml=pairs.map(p=>'<button class="match-item match-left" id="ml-'+p.idx+'" onclick="App._pickLeft('+p.idx+')"><span class="match-ico">'+p.icon+'</span><span>'+p.sign+'</span></button>').join('');
      const rightHtml=rights.map(r=>'<button class="match-item match-right" id="mr-'+r.idx+'" onclick="App._pickRight('+r.idx+')">'+r.short+'</button>').join('');
      document.getElementById('activity-area').innerHTML=
        '<span class="act-tag act-game">\u{1F3AE} Matching Game</span>'+
        '<p style="font-size:var(--font-size-sm);color:var(--text-muted);margin-bottom:var(--space-4);text-align:center;">Tap a sign, then tap its meaning. Match all '+pairs.length+' pairs!</p>'+
        '<div class="match-grid"><div class="match-col">'+leftHtml+'</div><div class="match-col">'+rightHtml+'</div></div>'+
        '<p id="match-status" style="text-align:center;margin-top:var(--space-4);font-weight:700;color:var(--text-muted);">0 / '+pairs.length+' matched</p>';
    },
    _pickLeft(idx){ const el=document.getElementById('ml-'+idx); if(el.classList.contains('matched')) return;
      document.querySelectorAll('.match-left').forEach(b=>b.classList.remove('selected'));
      this.mg.sel=idx; el.classList.add('selected'); },
    _pickRight(idx){ const r=document.getElementById('mr-'+idx); if(r.classList.contains('matched')) return;
      if(this.mg.sel===null){ r.classList.add('shake'); setTimeout(()=>r.classList.remove('shake'),400); return; }
      const l=document.getElementById('ml-'+this.mg.sel);
      if(this.mg.sel===idx){ l.classList.remove('selected'); l.classList.add('matched'); r.classList.add('matched');
        this.mg.matched++; this._addXP(10); this.mg.sel=null;

    },
    _backToGames(key){

    },
    _backFromMatch(){ this._backToGames('match'); },
    _shufArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; },
    _tf:null,

      });
      this._tf={qs:qs,i:0,score:0};
      this._renderTFQ();
    },
    _renderTFQ(){
      const st=this._tf;

      const q=st.qs[st.i];
      document.getElementById('activity-area').innerHTML=`<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:#EDE9FE;color:#6D28D9;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:12px;">⚖️ True or False · ${st.i+1} / ${st.qs.length}</span><div class="card" style="padding:var(--space-6);text-align:center;"><div style="font-size:2.6rem;margin-bottom:var(--space-2);">${q.sign.icon}</div><p style="font-size:var(--font-size-lg);font-weight:800;color:var(--text-main);margin-bottom:var(--space-3);">${q.sign.text}</p><p style="color:var(--text-muted);margin-bottom:var(--space-5);">Meaning shown: <strong>${q.shown}</strong></p><div style="display:flex;gap:var(--space-3);"><button class="btn btn-accent btn-block" onclick="App._tfAns(true,this)">✔ True</button><button class="btn btn-outline btn-block" onclick="App._tfAns(false,this)">✘ False</button></div><div id="tf-fb" style="margin-top:var(--space-4);font-weight:700;"></div></div>`;
    },
    _tfAns(choice, btn){

    _tfResult(){

    },
    _tp:null,
    _renderTap(){

    _renderTapQ(){

    _tapResult(){

      document.getElementById('activity-area').innerHTML=`<div class="card" style="padding:var(--space-6);text-align:center;"><div style="font-size:3rem;margin-bottom:var(--space-2);">👆</div><div style="font-size:1.6rem;font-weight:800;color:var(--accent-700);margin-bottom:var(--space-1);">${pct}%</div><p style="color:var(--text-muted);margin-bottom:var(--space-5);">You matched ${st.score} of ${st.qs.length} signs.</p><button class="btn btn-primary btn-block" onclick="App._backToGames('tap')">← Back to Games</button></div>`;

    /* ── Memory Match (Unit 3) ── */
    _renderMemoryGame(){
      const pool = this._shufArr([...UNITS[this.sess].signs]).slice(0, 5);
      let cards = [];
      pool.forEach(s => {
        cards.push({ id: s.text, label: `<div style="font-size:1.5rem;">${s.icon}</div><div>${s.text}</div>` });
        cards.push({ id: s.text, label: `<div style="font-size:0.9rem;">${s.short || s.meaning}</div>` });
      });
      this.mem = { cards: this._shufArr(cards), flipped: [], matched: [], moves: 0, pairs: pool.length };
      this._renderMemBoard();
    },
    _renderMemBoard(){
      const m = this.mem;
      const cells = m.cards.map((c, i) => {
        const up = m.flipped.includes(i) || m.matched.includes(c.id);
        const done = m.matched.includes(c.id);
        const bg = done ? 'var(--accent-50)' : up ? 'white' : 'var(--surface-2,#F3F4F6)';
        const border = done ? 'var(--accent)' : 'var(--border)';
        return `<button onclick="App._memFlip(${i})" ${up?'disabled':''} style="min-height:90px;border-radius:var(--radius-lg);border:2px solid ${border};background:${bg};font-weight:700;color:var(--text-main);font-size:var(--font-size-sm);padding:var(--space-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">${up?c.label:'❓'}</button>`;
      }).join('');
      document.getElementById('activity-area').innerHTML=`<div class="anim-fade-in-up"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3);"><span style="font-weight:800;color:var(--text-main);">🧠 Memory Match</span><span style="font-size:var(--font-size-sm);color:var(--text-muted);">Moves: ${m.moves} · ${m.matched.length}/${m.pairs}</span></div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3);">${cells}</div><button class="btn btn-outline btn-block" style="margin-top:var(--space-4);" onclick="App._backToGames('memory')">← Back to Games</button></div>`;
    },
    _memFlip(i){
      const m = this.mem;
      if(m.flipped.length >= 2 || m.flipped.includes(i) || m.matched.includes(m.cards[i].id)) return;
      m.flipped.push(i);
      this._renderMemBoard();
      if(m.flipped.length === 2){
        m.moves++;
        const a = m.flipped[0], b = m.flipped[1];
        if(m.cards[a].id === m.cards[b].id){
          m.matched.push(m.cards[a].id); m.flipped = []; this._addXP(10);
          setTimeout(() => { if(m.matched.length === m.pairs) this._renderMemDone(); else this._renderMemBoard(); }, 550);
        } else {
          setTimeout(() => { m.flipped = []; this._renderMemBoard(); }, 850);
        }
      }
    },
    _renderMemDone(){
      this._addXP(20);
      document.getElementById('activity-area').innerHTML=`<div class="card" style="padding:var(--space-6);text-align:center;"><div style="font-size:3rem;margin-bottom:var(--space-2);">🧠</div><div style="font-size:1.5rem;font-weight:800;color:var(--accent-700);margin-bottom:var(--space-1);">All matched!</div><p style="color:var(--text-muted);margin-bottom:var(--space-5);">You matched every sign in ${this.mem.moves} moves.</p><button class="btn btn-primary btn-block" onclick="App._backToGames('memory')">← Back to Games</button></div>`;

    _completeSess(){ this.done[this.sess]=true; this._saveProgress(); this._updateTabs(); this._updateHero();

    _loadXP(){ try{ this.xp=parseInt(localStorage.getItem('emodul_read_xp')||'0',10)||0; }catch(e){} },
    _saveProgress(){ try{ localStorage.setItem('emodul_read_prog', JSON.stringify(this.done)); }catch(e){} },
    _loadProgress(){ try{ const d=JSON.parse(localStorage.getItem('emodul_read_prog')); if(d && d.length===4){ this.done=d; return; } }catch(e){} this.done=[false,false,false,false]; }
  };

    if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', ()=>App.init());
  } else {
    App.init();
  }
  </script>
