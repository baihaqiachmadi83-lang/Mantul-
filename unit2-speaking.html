<script>/*MANTUL_THEME_BOOT*/
(function(){try{var t=localStorage.getItem('mantul_theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
window.toggleTheme=function(){try{var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',cur);localStorage.setItem('mantul_theme',cur);var ic=document.getElementById('theme-icon');if(ic)ic.textContent=cur==='dark'?'☀️':'🌙';var fic=document.getElementById('mantul-float-icon');if(fic)fic.textContent=cur==='dark'?'☀️':'🌙';}catch(e){}};
document.addEventListener('DOMContentLoaded',function(){try{var cur=document.documentElement.getAttribute('data-theme');var ic=document.getElementById('theme-icon');if(ic){ic.textContent=cur==='dark'?'☀️':'🌙';return;}var b=document.createElement('button');b.type='button';b.title='Toggle Light/Dark Mode';b.setAttribute('aria-label','Toggle light and dark mode');b.onclick=window.toggleTheme;b.style.cssText='position:fixed;top:14px;right:14px;z-index:99999;width:40px;height:40px;border-radius:9999px;border:none;background:rgba(120,120,120,.18);color:inherit;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);';var s=document.createElement('span');s.id='mantul-float-icon';s.textContent=cur==='dark'?'☀️':'🌙';b.appendChild(s);document.body.appendChild(b);}catch(e){}});
</script>

  <style>
    /* ══════════════════════════════════════════════════════
       SPEAKING PAGE – Page-specific styles
       ══════════════════════════════════════════════════════ */
    body { background: var(--surface); }

    /* ── SESSION TABS ── */
    .sess-tabs {
      display: flex; gap: var(--space-2); overflow-x: auto;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      padding-bottom: var(--space-1);
    }
    .sess-tabs::-webkit-scrollbar { display: none; }
    .sess-tab {
      display: inline-flex; align-items: center; gap: 6px;
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-full);
      font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold);
      border: 1.5px solid var(--border); background: var(--card);
      color: var(--text-muted); cursor: pointer; white-space: nowrap;
      flex-shrink: 0; transition: all var(--transition-fast);
      -webkit-tap-highlight-color: transparent;
    }
    .sess-tab.active  { background: var(--primary); border-color: var(--primary); color: white; }
    .sess-tab.done    { background: var(--accent-50); border-color: var(--accent); color: var(--accent-700); }
    .sess-tab.locked  { opacity: .4; cursor: not-allowed; pointer-events: none; }

    /* ── PHASE STRIP ── */
    .phase-strip { display: flex; align-items: center; gap: 0; }
    .phase-node { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .phase-dot {
      width: 30px; height: 30px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 13px;
      font-weight: 700; transition: all var(--transition-base);
      border: 2px solid transparent;
    }
    .phase-dot.done    { background: var(--accent); color: white; }
    .phase-dot.active  { background: var(--primary); color: white; box-shadow: 0 0 0 4px var(--primary-100); }
    .phase-dot.upcoming{ background: var(--surface-2); color: var(--text-faint); border-color: var(--border-2); }
    .phase-label { font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-faint); text-align: center; }
    .phase-label.active-label { color: var(--primary); }
    .phase-line { flex: 1; height: 2px; background: var(--border); margin: 0 -4px;
      position: relative; top: -10px; transition: background var(--transition-base); }
    .phase-line.done { background: var(--accent); }

    /* ── HERO CARD ── */
    .sess-hero {
      border-radius: var(--radius-2xl); padding: var(--space-5) var(--space-6);
      color: white; position: relative; overflow: hidden; margin-bottom: var(--space-4);
    }
    .sess-hero-deco {
      position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
      font-size: 5rem; opacity: .15; pointer-events: none; line-height: 1;
    }

    /* ── CHAT UI (BUBBLES) ── */
    .chat-container {
      display: flex; flex-direction: column; gap: var(--space-4);
      padding: var(--space-2) 0;
    }
    .chat-row {
      display: flex; gap: var(--space-3); max-width: 90%;
      opacity: 0; transform: translateY(15px);
      animation: chatPop .4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes chatPop { to { opacity:1; transform:translateY(0); } }
    .chat-row.right { align-self: flex-end; flex-direction: row-reverse; }
    .chat-row.left  { align-self: flex-start; }

    .chat-avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; background: var(--surface-2); border: 2px solid white;
      box-shadow: var(--shadow-sm); z-index: 2;
    }
    .chat-row.right .chat-avatar { background: var(--primary-100); }
    .chat-row.left .chat-avatar  { background: var(--accent-100); }

    .chat-bubble-wrap { display: flex; flex-direction: column; gap: 4px; }
    .chat-row.right .chat-bubble-wrap { align-items: flex-end; }
    .chat-row.left .chat-bubble-wrap  { align-items: flex-start; }

    .chat-bubble {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-2xl);
      font-size: var(--font-size-base); line-height: 1.5;
      position: relative; box-shadow: var(--shadow-sm);
    }
    .chat-row.left .chat-bubble {
      background: white; border-top-left-radius: 4px; color: var(--text-main);
      border: 1px solid var(--border);
    }
    .chat-row.right .chat-bubble {
      background: var(--primary); border-top-right-radius: 4px; color: white;
    }

    .chat-trans {
      font-size: var(--font-size-sm); color: var(--text-muted);
      font-style: italic; margin-top: 4px; padding: 0 8px;
    }
    .chat-row.right .chat-trans { text-align: right; }

    /* TTS Button */
    .btn-tts {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.08); color: inherit; cursor: pointer;
      transition: all var(--transition-fast); margin-left: 8px; vertical-align: middle;
    }
    .chat-row.right .btn-tts { background: rgba(255,255,255,.2); color: white; }
    .btn-tts:hover { transform: scale(1.1); background: rgba(0,0,0,.15); }
    .chat-row.right .btn-tts:hover { background: rgba(255,255,255,.3); }
    .btn-tts.playing {
      animation: pulsePlay 1.5s infinite;
      background: var(--accent); color: white;
    }
    @keyframes pulsePlay {
      0% { box-shadow: 0 0 0 0 rgba(16,185,129,.5); }
      70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    /* ── MIC BUTTON (Imitate Phase) ── */
    .mic-wrap { text-align: center; margin: var(--space-5) 0; }
    .btn-mic {
      width: 70px; height: 70px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-700));
      color: white; font-size: 1.8rem; display: inline-flex;
      align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 8px 16px rgba(37,99,235,.25); transition: all .3s cubic-bezier(0.175,0.885,0.32,1.275);
      position: relative;
    }
    .btn-mic::before {
      content: ''; position: absolute; inset: -10px; border-radius: 50%;
      border: 2px solid var(--primary-300); opacity: 0; transition: all .3s ease;
    }
    .btn-mic:active { transform: scale(0.92); }
    .btn-mic.recording {
      background: linear-gradient(135deg, var(--danger), #991B1B);
      animation: micPulse 1.5s infinite;
    }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(239,68,68,.6); }
      70% { box-shadow: 0 0 0 15px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }

    /* ── BLANK CHAT (Compose Phase) ── */
    .chat-blank {
      display: inline-block; min-width: 60px; height: 24px;
      border-bottom: 2px dashed var(--border-2); margin: 0 4px;
      vertical-align: bottom; background: rgba(255,255,255,.5);
    }
    .chat-row.right .chat-blank { border-color: rgba(255,255,255,.5); background: rgba(0,0,0,.1); }

    /* ── ACTIVITY TAG ── */
    .act-tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px var(--space-2); border-radius: var(--radius-full);
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .07em; margin-bottom: var(--space-3);
    }
    .act-listen { background: var(--primary-100); color: var(--primary-700); }
    .act-speak  { background: var(--accent-100);  color: var(--accent-700); }
    .act-fill   { background: var(--warm-100);    color: var(--warm-700); }

    /* ── SCORE RING ── */
    .score-ring {
      width: 110px; height: 110px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-4); position: relative;
    }
    .score-ring-inner {
      width: 80px; height: 80px; border-radius: 50%; background: white;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .result-grade {
      font-size: 2.5rem; font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

  </style>
</head>

  /* ════════════════════════════════════════════════════════
     2. APP STATE & CONFIG
     ════════════════════════════════════════════════════════ */
  const App = {
    sess:  0,
    phase: 0, // 0=Listen, 1=Imitate, 2=Compose
    xp:    0,
    done:  [false,false,false,false],
    
    ls: { currentLine: 0 }, // Listen state
    is: { currentLine: 0, recording: false }, // Imitate state
    cs: { qi: 0, qs: [], quizSess: null }, // Compose state
    cq: { qi: 0, score: 0, qs: [], quizSess: null }, // Closing quiz state

    PHASE_ICONS: ['📖', '✍️', '🎮'],
    PHASE_NAMES: ['Material', 'Exercise', 'Game'],

    /* ── INIT ── */
    init(){
      this._loadProgress();
      this._loadXP();
      FeedbackEngine.init({
        onNext:  () => this.sess === 4 ? this._closingQuizNext() : this._composeNext(),
        onRetry: () => this.sess === 4 ? this._closingQuizRetry() : this._composeRetry(),
        onSkip:  () => this.sess === 4 ? this._closingQuizNext() : this._composeNext(),
      });
      
      // Warm up TTS
      if('speechSynthesis' in window){
        window.speechSynthesis.getVoices();
      }

      this.render();
    },

    goTo(n){
      FeedbackEngine.dismiss();
      if('speechSynthesis' in window) window.speechSynthesis.cancel();
      this.sess=n; this.phase=0;
      this.render();
      window.scrollTo({top:0,behavior:'smooth'});
    },

    nextPhase(){
      if(this.phase<2){
        this.phase++;
        this.render();
        setTimeout(()=>window.scrollTo({top:100,behavior:'smooth'}),50);
      } else {
        this._completeSess();
      }
    },

    /* ── RENDER ROOT ── */
    render(){
      this._updateHero();
      this._updateTabs();
      this._updatePhaseStrip();
      if(this.sess===4){ this._renderClosingQuiz(); return; }
      [this._renderListen, this._renderImitate, this._renderGameHub][this.phase].call(this);
    },

    _updateHero(){
      if(this.sess===4){
        document.getElementById('sess-hero').style.background='linear-gradient(135deg,#DC2626,#7F1D1D)';
        document.getElementById('hero-deco').textContent='🎯';
        document.getElementById('hero-title').textContent='Quiz';
        document.getElementById('hero-desc').textContent='Test your knowledge from all speaking scenarios.';
        const bar=document.getElementById('hero-bar');
        if(bar) bar.style.width='0%';
        return;
      }
      const s = SCENARIOS[this.sess];
      document.getElementById('sess-hero').style.background = s.bg;
      document.getElementById('hero-deco').textContent = s.emoji;
      document.getElementById('hero-title').textContent = s.title;
      document.getElementById('hero-desc').textContent = s.desc;

      const sessPct = Math.round((this.phase/3)*100);
      const bar = document.getElementById('hero-bar');
      if(bar){ bar.style.width='0%'; setTimeout(()=>{ bar.style.width=`${sessPct}%`; },100); }
    },

    _updateTabs(){
      for(let i=0;i<5;i++){
        const el=document.getElementById(`tab-${i}`);
        if(!el) continue;
        el.className='sess-tab';
        if(i===this.sess){ el.classList.add('active'); }
        else if(i<4 && this.done[i]){ el.classList.add('done'); }
        el.setAttribute('aria-selected', i===this.sess?'true':'false');
      }
    },

    _updatePhaseStrip(){
      const strip=document.getElementById('phase-strip');
      const lbl=document.getElementById('phase-label-text');
      const pp=document.getElementById('phase-panel');
      if(this.sess===4){
        if(pp) pp.style.display='none'; return;
      }
      if(pp) pp.style.display='';
      if(!strip) return;

      let html='';
      this.PHASE_NAMES.forEach((name,i)=>{
        const isDone=i<this.phase;
        const isAct=i===this.phase;
        const cls=isDone?'done':isAct?'active':'upcoming';
        const icon=isDone?'✓':this.PHASE_ICONS[i];
        const lblCls=isAct?'phase-label active-label':'phase-label';
        
        html+=`<div class="phase-node">
          <div class="phase-dot ${cls}" title="${name}">${icon}</div>
          <span class="${lblCls}">${name}</span>
        </div>`;
        if(i<2) html+=`<div class="phase-line ${isDone?'done':''}"></div>`;
      });
      strip.innerHTML=html;
    },

    /* ═══════════════════════════════════════════════════════
       PHASE 0: LISTEN (Dengar)
       ═══════════════════════════════════════════════════════ */
    _renderListen(){
      this.ls.currentLine = 0;
      const s = SCENARIOS[this.sess];

      document.getElementById('activity-area').innerHTML=`
        <span class="act-tag act-listen">
          🎧 Listen & Understand &middot; Notice the pronunciation
        </span>

        <div class="card" style="padding:var(--space-5);background:var(--card);">
          <p style="font-size:10px;font-weight:800;text-transform:uppercase;
            letter-spacing:.07em;color:var(--text-faint);margin-bottom:var(--space-3);">💬 Sample Dialogue — Listen & Read Along</p>
          <div class="chat-container" id="listen-chat"></div>
          <div style="margin-top:var(--space-6);display:flex;justify-content:center;">
            <button class="btn btn-primary" onclick="App._playAllListen()" id="btn-play-all">
              ▶️ Play All Dialogue
            </button>
            <button class="btn btn-accent" onclick="App.nextPhase()" id="btn-next-phase" style="display:none;">
              Next: Exercise →
            </button>
          </div>
        </div>`;

      // Render all bubbles at once but keep them static initially
      const chat = document.getElementById('listen-chat');
      let html = '';
      s.dialogue.forEach((line, i) => {
        const side = line.role === 'A' ? 'left' : 'right';
        const gender = (line.avatar.includes('👩') || line.avatar.includes('👱‍♀️')) ? 'female' : 'male';
        const safeText = line.en.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        html += `
          <div class="chat-row ${side}" id="lr-${i}" style="animation-delay:${i*0.2}s">
            <div class="chat-avatar">${line.avatar}</div>
            <div class="chat-bubble-wrap">
              <div class="chat-bubble">
                ${line.en}
                <button class="btn-tts" onclick="window.playTTS('${safeText}', this, '${gender}', '${line.role}')" aria-label="Listen to this sentence">🔊</button>
              </div>
              <span class="chat-trans">${line.id_}</span>
            </div>
          </div>`;
      });
      chat.innerHTML = html;

      // Automatically let user proceed, listening is self-paced
      setTimeout(() => {
        document.getElementById('btn-play-all').style.display = 'none';
        document.getElementById('btn-next-phase').style.display = 'inline-flex';
        this._addXP(10);
      }, 5000); // just reveal button after 5s
    },

    async _playAllListen(){
      if(!('speechSynthesis' in window)) return;
      const s = SCENARIOS[this.sess];

      const btnPlay = document.getElementById('btn-play-all');
      const btnNext = document.getElementById('btn-next-phase');
      if(btnPlay) btnPlay.style.display = 'none';
      if(btnNext) btnNext.style.display = 'none';

      // Play each line sequentially — wait for TTS to finish before next
      for(let i = 0; i < s.dialogue.length; i++){
        const line = s.dialogue[i];
        const btn = document.querySelector(`#lr-${i} .btn-tts`);
        const gender = (line.avatar.includes('👩') || line.avatar.includes('👱‍♀️')) ? 'female' : 'male';
        await window.playTTS(line.en, btn, gender, line.role);
        // Short natural pause between lines
        await new Promise(res => setTimeout(res, 400));
      }

      if(btnNext) btnNext.style.display = 'inline-flex';
      this._addXP(15);
    },

    /* ═══════════════════════════════════════════════════════
       PHASE 1: IMITATE (Tirukan)
       ═══════════════════════════════════════════════════════ */
    _renderImitate(){
      this.is.currentLine = 0;
      this._renderImitateLine();

    _toggleMic(){

      const s = SCENARIOS[this.sess];
      const line = s.exerciseDialogue[this.is.currentLine];
      const target = line.en;

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

      // Fallback: browser tanpa Speech Recognition - jangan klaim benar
      if(!SR){
        btn.classList.remove('recording');
        btn.innerHTML = '🎤';
        hint.innerHTML = 'This browser cannot score your voice. Say the sentence aloud, then tap "Next".';
        hint.style.color = 'var(--warm-600)';

          const b = document.createElement('button');
          b.id = 'mic-manual-next';

          b.onclick = () => { this.is.recording=false; this.is.currentLine++; this._renderImitateLine(); };

        return;
      }

      this.is.recording = true;
      btn.classList.add('recording');
      btn.innerHTML = '🎤';
      btn.style.background = '';
      hint.textContent = 'Listening... say it now!';
      hint.style.color = 'var(--danger)';

      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 3;
      let handled = false;

      const finish = () => { this.is.recording = false; btn.classList.remove('recording'); };

      rec.onresult = (e) => {
        handled = true;
        let best = '', bestScore = 0;
        const res = e.results[0];
        for(let i=0;i<res.length;i++){
          const sc = App._similarity(target, res[i].transcript);
          if(sc >= bestScore){ bestScore = sc; best = res[i].transcript; }
        }
        finish();
        App._judgeSpeech(target, best, bestScore, btn, hint);
      };

      rec.onerror = (e) => {
        finish();
        btn.innerHTML = '🎤';
        if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
          hint.innerHTML = 'Please allow microphone access to check your pronunciation.';
        } else if(e.error === 'no-speech'){
          hint.innerHTML = 'No voice detected. Tap the mic and try again.';
        } else {
          hint.innerHTML = 'Something went wrong. Tap the mic to try again.';
        }
        hint.style.color = 'var(--warm-600)';
      };

      rec.onend = () => { if(!handled) finish(); };

      try { rec.start(); } catch(err){ finish(); }
    },

    /* ─── Bandingkan target vs ucapan → skor 0..1 ───
       Menggunakan karakter-level Levenshtein yang dinormalisasi.
       Ini jauh lebih ketat dari word-overlap:
       - "morning" vs "evening"  → skor rendah (~0.1)
       - "I am fine thank you"   → skor tinggi (>0.9)
    */
    _similarity(target, spoken){
      const norm = (t) => {
        let s = (t||'').toLowerCase().replace(/[^a-z0-9\s']/g,'').replace(/\s+/g,' ').trim();
        s = s.replace(/\b10000\b/g, 'ten thousand')
             .replace(/\b15000\b/g, 'fifteen thousand')
             .replace(/\b20000\b/g, 'twenty thousand')
             .replace(/\b1\b/g, 'one')
             .replace(/\b2\b/g, 'two')
             .replace(/\b3\b/g, 'three')
             .replace(/\b4\b/g, 'four')
             .replace(/\b5\b/g, 'five')
             .replace(/\b6\b/g, 'six')
             .replace(/\b7\b/g, 'seven')
             .replace(/\b8\b/g, 'eight')
             .replace(/\b9\b/g, 'nine')
             .replace(/\b10\b/g, 'ten');
        return s;
      };
      const a = norm(target);
      const b = norm(spoken);
      if(!a && !b) return 1;
      if(!a || !b) return 0;

      // Levenshtein distance (karakter)
      const la = a.length, lb = b.length;
      const dp = Array.from({length: la+1}, (_,i) => Array.from({length: lb+1}, (_,j) => i===0?j:j===0?i:0));
      for(let i=1; i<=la; i++){
        for(let j=1; j<=lb; j++){
          dp[i][j] = a[i-1]===b[j-1]
            ? dp[i-1][j-1]
            : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
        }
      }
      const dist = dp[la][lb];
      const charSim = 1 - dist / Math.max(la, lb);

      // Word overlap sebagai sinyal tambahan
      const wa = a.split(' ').filter(Boolean);
      const wb = b.split(' ').filter(Boolean);
      const wbCount = {};
      wb.forEach(w => wbCount[w] = (wbCount[w]||0)+1);
      let matched = 0;
      wa.forEach(w => { if(wbCount[w]>0){ matched++; wbCount[w]--; } });
      const wordSim = wa.length ? matched/wa.length : 0;

      // Gabungkan: 70% char similarity + 30% word overlap
      let score = charSim * 0.7 + wordSim * 0.3;

      // STRICT PENALTY: Untuk kalimat panjang, satu kata penting (seperti angka/arah) 
      // yang salah bisa tetap menghasilkan skor > 0.7. Kita wajibkan kata kunci ini cocok.
      const critical = ['one','two','three','four','five','six','seven','eight','nine','ten','fifteen','twenty','thousand','left','right'];
      for(let w of critical){
        const inA = wa.some(x => x === w || x === w+'s');
        const inB = wb.some(x => x === w || x === w+'s');
        if(inA !== inB){
          score = Math.min(score, 0.4); // Pastikan tidak lolos
        }
      }

      // STRICT PENALTY 2: Jika kata yang diucapkan kurang dari kalimat target (tidak lengkap)
      if (wb.length < wa.length) {
        const missingWords = wa.length - wb.length;
        score -= (missingWords * 0.15); // Kurangi 15% untuk setiap kata yang hilang
      }

      return Math.max(0, score);
    },

    _judgeSpeech(target, spoken, score, btn, hint){
      const PASS = 0.7;
      if(score >= PASS){
        btn.innerHTML = '✓';
        btn.style.background = 'var(--accent)';
        const label = score >= 0.95 ? 'Perfect! 🌟' : 'Good job! Your pronunciation is correct.';
        hint.innerHTML = label + '<br><span style="color:var(--text-faint);font-weight:400;">Heard: “'+ (spoken||'') +'”</span>';
        hint.style.color = 'var(--accent-700)';
        this._addXP(5);
        setTimeout(() => { this.is.currentLine++; this._renderImitateLine(); }, 1800);
      } else {
        btn.innerHTML = '↻';
        btn.style.background = 'var(--danger)';
        const pct = Math.round(score*100);
        hint.innerHTML = 'Not quite ('+pct+'% match). Try again!'
          + '<br><span style="color:var(--text-faint);font-weight:400;">Heard: “'+ (spoken||'(nothing)') +'”</span>'
          + '<br><span style="color:var(--text-faint);font-weight:400;">Target: “'+ target +'”</span>'
          + '<br><span style="color:var(--danger);font-size:0.85em;margin-top:4px;display:block;">(Tap mic to retry)</span>';
        hint.style.color = 'var(--danger)';
        setTimeout(() => { btn.innerHTML='🎤'; btn.style.background=''; }, 1500);
      }
    },

    },
    _toggleSayMic(){
      const btn = document.getElementById('say-btn-mic');
      const hint = document.getElementById('say-mic-hint');
      if(this._sg.recording) return;

      const target = this._sg.qs[this._sg.i].en;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

      if(!SR){
        btn.classList.remove('recording');
        btn.innerHTML = '🎤';
        hint.innerHTML = 'Browser tidak mendukung rekaman suara. Coba pakai Chrome / Browser does not support speech recognition.';
        hint.style.color = 'var(--warm-600)';
        return;
      }

      this._sg.recording = true;
      btn.classList.add('recording');
      btn.innerHTML = '🎤';
      btn.style.background = '';
      hint.textContent = 'Listening... say it now!';
      hint.style.color = 'var(--danger)';

      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 3;
      let handled = false;

      const finish = () => { this._sg.recording = false; btn.classList.remove('recording'); };

      rec.onresult = (e) => {
        handled = true;
        let best = '', bestScore = 0;
        const res = e.results[0];
        for(let i=0;i<res.length;i++){
          const sc = App._similarity(target, res[i].transcript);
          if(sc >= bestScore){ bestScore = sc; best = res[i].transcript; }
        }
        finish();
        
        const PASS = 0.55;
        if(bestScore >= PASS){
          btn.innerHTML = '✓';
          btn.style.background = 'var(--accent)';
          hint.innerHTML = 'Perfect! 🌟<br><span style="color:var(--text-faint);font-weight:400;">Heard: “'+ (best||'') +'”</span>';

          hint.style.color = 'var(--danger)';
          setTimeout(() => { btn.innerHTML='🎤'; btn.style.background=''; }, 1500);
        }
      };
      rec.onerror = (e) => { finish(); btn.innerHTML = '🎤'; hint.innerHTML = 'Error listening. Tap to try again.'; hint.style.color = 'var(--warm-600)'; };

    /* ═══════════════════════════════════════════════════════
       UTILS (TTS, XP)
       ═══════════════════════════════════════════════════════ */
    speak(text, btnElement) {
      if(!('speechSynthesis' in window)) return;
      
      // Hanya cancel jika memang sedang ada yang berbicara/antre untuk menghindari bug cancel() di Windows
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.9;
      
      const voices = window.speechSynthesis.getVoices();
      let selectedVoice = voices.find(v => (v.lang === 'en-GB' || v.lang === 'en_GB') && (v.name.includes('Google') || v.name.includes('Natural'))) 
                          || voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB')
                          || voices.find(v => v.lang.startsWith('en'));
      
      // Jika sama sekali tidak ada suara bahasa Inggris, ambil suara default pertama
      if (!selectedVoice && voices.length > 0) {
        selectedVoice = voices[0];
      }
      
      if (selectedVoice) {
        utterance.voice = selectedVoice;
        utterance.lang = selectedVoice.lang;
      } else {
        utterance.lang = 'en-US';
      }
      
      // Mencegah Garbage Collection bug
      window._synth_utterance = utterance;
      
      if(btnElement) {
        // Hapus kelas playing dari tombol lain yang mungkin nyangkut
        document.querySelectorAll('.btn-tts.playing').forEach(el => el.classList.remove('playing'));
        btnElement.classList.add('playing');
        utterance.onend = () => btnElement.classList.remove('playing');
        utterance.onerror = () => btnElement.classList.remove('playing');
      }
      
      window.speechSynthesis.speak(utterance);
      
      // Workaround ampuh untuk bug Chrome/Edge dimana TTS nyangkut dan diam saja
      if (window.speechSynthesis.pause && window.speechSynthesis.resume) {
        window.speechSynthesis.resume();
      }
    },

    _addXP(n){
      this.xp += n;
      try{ localStorage.setItem('emodul_speak_xp', this.xp); }catch{}
      const el = document.getElementById('nav-xp');
      if(el){
        el.textContent = `${this.xp} XP`;
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = 'heartbeat .4s ease both';
      }
    },
    _loadXP(){
      try{ this.xp = parseInt(localStorage.getItem('emodul_speak_xp')||'0',10)||0; }catch{}
    },
    _saveProgress(){
      try{ localStorage.setItem('emodul_speak_prog', JSON.stringify(this.done)); }catch{}
    },
    _loadProgress(){
      try{ 
        const d = JSON.parse(localStorage.getItem('emodul_speak_prog'));
        if(d && d.length===4) { this.done = d; return; }
      }catch{}
      this.done = [false,false,false,false];
    },

    /* ═══════════════════════════════════════════════════════
       CLOSING QUIZ (Quiz Section)
       ═══════════════════════════════════════════════════════ */
    _renderClosingQuiz(){
      // Collect all quiz questions from all scenarios
      const allQs = SCENARIOS.flatMap(s => s.quiz || []);
      const pool = this._shufArr([...allQs]).slice(0, 10);

      this.cq = {
        qi: 0, score: 0, qs: pool,
        quizSess: QuizStore.startSession('speak_unit2_close'),
      };
      this._renderClosingQ();
    },

    _renderClosingQ(){
      const cq = this.cq;
      if(cq.qi >= cq.qs.length){ this._renderClosingResult(); return; }
      const q = cq.qs[cq.qi];
      const keys = ['A','B','C','D'];
      const pct = Math.round((cq.qi / cq.qs.length) * 100);

      document.getElementById('activity-area').innerHTML = `
        <span class="act-tag act-quiz" style="margin-bottom:var(--space-3);display:inline-flex;">
          🎯 Quiz &middot; ${cq.qi+1} / ${cq.qs.length}
        </span>

        <div class="progress-bar-track progress-bar-track--thin" style="margin-bottom:var(--space-4);">
          <div class="progress-bar-fill" style="width:${pct}%;transition:width .4s ease;"></div>
        </div>

        <div class="card" style="padding:var(--space-5);" id="quiz-question-card">
          <div style="text-align:center;margin-bottom:var(--space-5);">
            <p style="font-size:var(--font-size-lg);font-weight:800;color:var(--text-main);">
              ${q.text}</p>
          </div>
          <div style="display:flex;flex-direction:column;gap:var(--space-2);" id="quiz-options">
            ${q.options.map((opt,i) => `
              <button class="quiz-option" id="option-${i}" data-index="${i}"
                onclick="App._handleCloseAns(${i})"
                aria-label="Option ${keys[i]}: ${opt}">
                <span class="quiz-option-key">${keys[i]}</span>
                <span class="quiz-option-text">${opt}</span>
              </button>`).join('')}
          </div>
        </div>`;
    },

    _handleCloseAns(sel){
      const cq = this.cq;
      const q = cq.qs[cq.qi];
      const ok = sel === q.correct;

      document.querySelectorAll('#quiz-options .quiz-option').forEach((btn,i) => {
        btn.classList.add('quiz-option--disabled');
        if(i === q.correct) btn.classList.add('quiz-option--correct');
        else if(i === sel && !ok) btn.classList.add('quiz-option--wrong');
      });

      QuizStore.recordAnswer(cq.quizSess, q.id, ok, 0, sel);
      if(ok){ cq.score++; this._addXP(20); FeedbackEngine.showCorrect(q, sel); }
      else { 
        this.wrongAnswers = this.wrongAnswers || [];
        this.wrongAnswers.push({q, sel});
        FeedbackEngine.showWrong(q, sel); 
      }
    },

    _closingQuizNext(){ this.cq.qi++; this._renderClosingQ(); },
    _closingQuizRetry(){
      this.wrongAnswers = [];
      document.querySelectorAll('#quiz-options .quiz-option').forEach((btn,i) => {
        btn.classList.remove('quiz-option--disabled','quiz-option--wrong','quiz-option--correct');
        btn.onclick = () => this._handleCloseAns(i);
      });
    },

    _renderClosingResult(){
      const cq = this.cq;
      const total = cq.qs.length;
      const pct = Math.round((cq.score / total) * 100);
      this._addXP(60);

      const res = QuizStore.finishSession(cq.quizSess, total);

      // Sync ke AppState
      try{
        const raw = localStorage.getItem('emodul_state');
        if(raw){
          const state = JSON.parse(raw);
          const u = (state.units||[]).find(u => u.id === 2);
          if(u){ u.progress = Math.max(u.progress||0, pct); if(pct >= 60) u.status = 'done'; }
          localStorage.setItem('emodul_state', JSON.stringify(state));
        }
      }catch{}

      const allDone = this.done.every(Boolean);

      document.getElementById('activity-area').innerHTML = `
        <div class="card" style="padding:var(--space-6);text-align:center;overflow:hidden;">
          <!-- Score ring -->
          <div class="score-ring" style="background:conic-gradient(
            var(--accent) ${pct*3.6}deg, var(--surface-2) ${pct*3.6}deg);">
            <div class="score-ring-inner">
              <span style="font-size:1.65rem;font-weight:800;color:var(--accent-700);">${pct}%</span>
              <span style="font-size:9px;color:var(--text-faint);font-weight:700;">SCORE</span>
            </div>
          </div>

          <h2 style="font-size:var(--font-size-2xl);font-weight:800;margin-bottom:var(--space-2);">
            ${pct>=80?'🏆 Outstanding!':pct>=60?'💪 Good job!':'🔄 Keep Practicing!'}</h2>
          <p style="color:var(--text-muted);margin-bottom:var(--space-4);">
            Correct: <strong>${cq.score} of ${total} questions</strong></p>

          ${res.isNewBest?`
            <div style="background:var(--warm-50);border:1px solid var(--warm-200);
              border-radius:var(--radius-lg);padding:var(--space-3);margin-bottom:var(--space-4);">
              <p style="font-size:var(--font-size-sm);font-weight:700;color:var(--warm-700);">
                🎉 New record! Best score: ${pct}%</p>
            </div>`:''}

          ${(this.wrongAnswers && this.wrongAnswers.length > 0) ? `
            <div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--danger);
              border-radius:var(--radius-lg);padding:var(--space-4);margin-bottom:var(--space-4);
              text-align:left;">
              <p style="font-size:var(--font-size-xs);font-weight:800;color:var(--text-faint);
                text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--space-3);">
                📝 Review My Mistakes (${this.wrongAnswers.length})</p>
              <div style="display:flex;flex-direction:column;gap:var(--space-3);">
                ${this.wrongAnswers.map((item, idx) => {
                  const keys = ['A','B','C','D'];
                  return `
                    <div style="border-bottom:1px solid var(--border);padding-bottom:var(--space-2);">
                      <p style="font-size:var(--font-size-sm);font-weight:700;color:var(--text-main);margin-bottom:4px;">Q${idx+1}: ${item.q.text}</p>
                      <div style="font-size:12px;display:flex;flex-direction:column;gap:2px;">
                        <span style="color:var(--danger);"><strong style="background:var(--danger-100);padding:0 4px;border-radius:4px;">Your Answer:</strong> ${item.q.options[item.sel]}</span>
                        <span style="color:var(--accent);"><strong style="background:var(--accent-100);padding:0 4px;border-radius:4px;">Correct:</strong> ${item.q.options[item.q.correct]}</span>
                        <span style="color:var(--text-body);margin-top:2px;">💡 ${item.q.whyCorrect || 'No explanation'}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}

          <!-- XP earned -->
          <div style="background:var(--warm-50);border:1px solid var(--warm-200);
            border-radius:var(--radius-lg);padding:var(--space-3);margin-bottom:var(--space-5);
            display:flex;align-items:center;justify-content:center;gap:var(--space-2);">
            <span style="font-size:1.2rem;" aria-hidden="true">⭐</span>
            <span style="font-size:var(--font-size-base);font-weight:800;color:var(--warm-700);">
              ${this.xp} XP earned this session!</span>
          </div>

          <div style="display:flex;flex-direction:column;gap:var(--space-3);">
            <button class="btn btn-primary btn-block" onclick="App._renderClosingQuiz()">
              ↺ Retry Quiz</button>
            ${allDone?`<a href="unit3-reading.html" class="btn btn-accent btn-block">
              Continue to Unit 3: Read & Respond 📖
            </a>` : ''}
            <a href="index.html" class="btn btn-outline btn-block">
              ← Back to Home</a>
          </div>
        </div>`;

      if(pct >= 80 && typeof Utils !== 'undefined') Utils.showConfetti?.();
    }
  };

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', ()=>App.init());
  } else {
    App.init();
  }
  </script>
</body>
</html>
